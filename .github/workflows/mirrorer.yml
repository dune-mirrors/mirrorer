---
name: mirror from gitlab to github

on:
  schedule:
  - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main

jobs:
  repos:
    runs-on: ubuntu-24.04
    outputs:
      repos: ${{ steps.repos.outputs.repos }}
    steps:
    - uses: actions/checkout@v7
    - id: repos
      run: |
        { echo 'repos<<EOF' ;
          python ./repos_to_matrix.py ;
          echo 'EOF' ; } >> "${GITHUB_OUTPUT}"

  mirror:
    runs-on: ubuntu-24.04
    needs: repos
    strategy:
      fail-fast: false
      # each job gets "module_name" and "url"
      matrix: ${{ fromJson(needs.repos.outputs.repos) }}
    steps:
    # Mint a short-lived installation token from the "DUNE Mirrorer" GitHub App
    # (app id 4076510 / client id Iv23liLgyeU7QoelDvvz). The app private key is
    # stored in the DUNE_MIRRORER_PRIVATE_KEY secret. The token is scoped to just the
    # target mirror repository and replaces the old per-repo SSH deploy keys.
    # NB: app-id is used rather than the newer client-id because actionlint's
    # bundled metadata does not yet recognise client-id; both are accepted by
    # the action and app-id only emits a soft (non-fatal) deprecation warning.
    - name: Generate push token for ${{ matrix.module_name }}
      id: app-token
      uses: actions/create-github-app-token@v3
      with:
        app-id: "4076510"
        private-key: ${{ secrets.DUNE_MIRRORER_PRIVATE_KEY }}
        owner: dune-mirrors
        repositories: ${{ matrix.module_name }}
    # Only needed by repositories that set "strip_blobs_bigger_than" in
    # repos.json. Pinned: the rewritten commit hashes are what downstream
    # consumers pin to, so the rewrite must stay byte-for-byte reproducible.
    - name: Install git-filter-repo for ${{ matrix.module_name }}
      if: matrix.strip_blobs_bigger_than != ''
      run: pipx install git-filter-repo==2.47.0
    - name: Mirror ${{ matrix.module_name }}
      env:
        MODULE_NAME: ${{ matrix.module_name }}
        SOURCE_URL: ${{ matrix.url }}
        STRIP_BLOBS_BIGGER_THAN: ${{ matrix.strip_blobs_bigger_than }}
        GH_TOKEN: ${{ steps.app-token.outputs.token }}
      run: |
        set -euo pipefail
        trap 'echo "::error title=mirror failed::${MODULE_NAME}: failed during \"${phase:-unknown}\" phase"' ERR

        target="https://github.com/dune-mirrors/${MODULE_NAME}.git"
        echo "=== Mirroring ${MODULE_NAME} ==="
        echo "source: ${SOURCE_URL}"
        echo "target: ${target}"

        phase=clone
        echo "::group::clone (mirror) ${SOURCE_URL}"
        git clone --mirror "${SOURCE_URL}" "${MODULE_NAME}"
        cd "${MODULE_NAME}"
        git remote set-url --push origin "${target}"
        git remote -v
        echo "::endgroup::"

        phase=fetch
        echo "::group::fetch -p origin"
        git fetch -p origin
        echo "::endgroup::"

        phase=inspect
        echo "::group::ref inventory"
        total=$(git for-each-ref | wc -l)
        branches=$(git for-each-ref refs/heads | wc -l)
        tags=$(git for-each-ref refs/tags | wc -l)
        mr=$(git for-each-ref refs/merge-requests | wc -l)
        echo "total refs: ${total} | branches: ${branches} | tags: ${tags} | merge-request refs (to drop): ${mr}"
        echo "::endgroup::"

        phase=cleanup
        echo "::group::drop GitLab merge-request refs"
        # Exclude GitLab merge-request refs (refs/merge-requests/*); GitHub rejects them on push.
        git for-each-ref --format 'delete %(refname)' refs/merge-requests | git update-ref --stdin
        echo "dropped ${mr} merge-request ref(s)"
        echo "::endgroup::"

        if [ -n "${STRIP_BLOBS_BIGGER_THAN}" ]; then
          phase=filter
          echo "::group::strip blobs bigger than ${STRIP_BLOBS_BIGGER_THAN}"
          # GitHub hard-rejects any pushed blob over 100 MB (GH001) and declines
          # the ENTIRE push when it finds one, so a single oversized blob
          # anywhere in history freezes the whole mirror. dune-alugrid carries
          # two ~500 MB benchmark outputs that were committed and deleted again
          # in 2014, leaving them in the ancestry of 82 of its 83 refs. Rewrite
          # them out so the rest of the history can be mirrored at all.
          #
          # This rewrites commit hashes from the first affected commit onward,
          # so this mirror's SHAs deliberately diverge from upstream GitLab.
          # The rewrite is deterministic for a pinned git-filter-repo version,
          # so later runs reproduce the same hashes and fast-forward normally.
          git filter-repo \
            --strip-blobs-bigger-than "${STRIP_BLOBS_BIGGER_THAN}" \
            --replace-refs delete-no-add \
            --force
          # filter-repo drops the remote as a safety measure; restore it so the
          # push phase below still has an "origin" to push to. Remove first so
          # this does not abort under "set -e" if a future filter-repo keeps it.
          git remote remove origin 2>/dev/null || true
          git remote add origin "${target}"
          echo "::endgroup::"
        fi

        phase=push
        echo "::group::push --mirror"
        # Supply the App token via an HTTP auth header so it is never written to
        # .git/config or shown in the remote URL.
        auth=$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 -w0)
        git -c http.extraheader="AUTHORIZATION: basic ${auth}" push --mirror
        echo "::endgroup::"

        echo "✓ mirrored ${MODULE_NAME} (${branches} branches, ${tags} tags)"

  mirror-success:
    runs-on: ubuntu-24.04
    needs: mirror
    # Always run so this gate reports an explicit pass/fail and is never left in a
    # "skipped" state (which branch protection treats as not passed, e.g. after a
    # partial "re-run failed jobs").
    if: always()
    steps:
    - name: Verify all mirror jobs succeeded
      env:
        MIRROR_RESULT: ${{ needs.mirror.result }}
      run: |
        echo "mirror jobs result: ${MIRROR_RESULT}"
        if [ "${MIRROR_RESULT}" != "success" ]; then
          echo "::error::one or more mirror jobs did not succeed (result: ${MIRROR_RESULT})"
          exit 1
        fi
        echo "All mirror jobs completed successfully"

  update-readme:
    runs-on: ubuntu-24.04
    needs: mirror
    # Record the last successful mirror time in the README on main. Only on real
    # mirror runs (not pull requests); `needs: mirror` ensures it runs only when
    # every mirror job succeeded. Kept separate from the mirror-success gate so a
    # README push problem never makes the required check fail.
    if: github.event_name != 'pull_request'
    # `statuses: write` lets the default GITHUB_TOKEN (the GitHub Actions app)
    # publish the manufactured "mirror-success" status below. Branch protection
    # pins that required check to the GitHub Actions app, so the status must be
    # created by this token — not the DUNE Mirrorer App token used for pushing.
    permissions:
      contents: read
      statuses: write
    steps:
    # main is a protected branch, so the default GITHUB_TOKEN cannot push to it.
    # Push with a DUNE Mirrorer App token instead. The App must be granted access
    # to the mirrorer repo and added to the branch protection "allow specified
    # actors to bypass required pull requests" list. That bypass waives the
    # pull-request requirement but NOT required status checks, so a fresh
    # "[skip ci]" timestamp commit — which never runs the required "mirror-success"
    # check against its own SHA — would otherwise be rejected (GH006). The commit
    # step below satisfies the check explicitly; for that the App additionally
    # needs the "Commit statuses: write" permission.
    - name: Generate token to update the README
      id: app-token
      uses: actions/create-github-app-token@v3
      with:
        app-id: "4076510"
        private-key: ${{ secrets.DUNE_MIRRORER_PRIVATE_KEY }}
        owner: dune-mirrors
        repositories: mirrorer
    - uses: actions/checkout@v7
      with:
        ref: main
        token: ${{ steps.app-token.outputs.token }}
    - name: Update last-updated timestamp in README
      run: |
        timestamp="$(date -u '+%Y-%m-%d %H:%M:%S UTC')"
        sed -i \
          "s|^Mirrors last updated at: .*|Mirrors last updated at: ${timestamp}|" \
          README.md
    - name: Commit and push if changed
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token }}
        # Default token = the GitHub Actions app, the app branch protection
        # expects to set the "mirror-success" required check. Used only for the
        # status POST; the git pushes keep using the App token above.
        GH_STATUS_TOKEN: ${{ github.token }}
        RUN_ID: ${{ github.run_id }}
      run: |
        set -euo pipefail
        git config user.name 'github-actions[bot]'
        git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

        if git diff --quiet -- README.md; then
          echo "README already up to date, nothing to commit."
          exit 0
        fi

        git add README.md
        git commit -m "chore: update mirrors last-updated timestamp [skip ci]"
        sha="$(git rev-parse HEAD)"

        # main's branch protection requires the "mirror-success" status check, which
        # a brand-new "[skip ci]" commit can never carry on its own SHA. The App's
        # bypass only waives the pull-request rule, not required status checks, so a
        # direct "git push origin main" is rejected with GH006. Land the commit
        # without weakening protection: publish it on a throwaway unprotected branch
        # so the SHA exists server-side, assert the required check on that SHA (the
        # `needs: mirror` dependency guarantees the mirror already succeeded), then
        # fast-forward main. The temp branch is always cleaned up.
        tmp_branch="ci/readme-timestamp-${RUN_ID}"
        trap 'git push origin --delete "${tmp_branch}" >/dev/null 2>&1 || true' EXIT

        git push origin "HEAD:refs/heads/${tmp_branch}"

        # Post the required check as the GitHub Actions app (the default token),
        # not the DUNE Mirrorer App token: branch protection rejects a
        # "mirror-success" status set by any other app (GH006).
        GH_TOKEN="${GH_STATUS_TOKEN}" gh api \
          --method POST \
          "repos/dune-mirrors/mirrorer/statuses/${sha}" \
          -f state=success \
          -f context=mirror-success \
          -f "description=timestamp commit follows a successful mirror run" \
          -f "target_url=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}"

        git push origin "HEAD:refs/heads/main"
        echo "Pushed README timestamp update to main (${sha})."
